<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF to JSON Converter (V3.2) – Sorted by Exam Date</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root { --primary: #2563eb; }
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f4f4f9; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 400px; }
        h2 { color: var(--primary); margin-bottom: 10px; }
        p { color: #666; margin-bottom: 20px; font-size: 0.9rem; }
        input { margin-bottom: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; width: 80%; }
        .bar-bg { width: 100%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; display: none; margin-top: 20px;}
        .bar-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.2s; }
        #status { margin-top: 15px; font-size: 0.9rem; color: #444; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>🗓️ Sorted data.json (V3.2)</h2>
    <p>Exams are automatically sorted by date (earliest first).</p>

    <input type="file" id="fileInput" accept="application/pdf" />
    
    <div class="bar-bg" id="progressContainer">
        <div class="bar-fill" id="progressBar"></div>
    </div>
    
    <div id="status">Waiting for file...</div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');

    const NAME_SKIP_WORDS = new Set(['EXAMINATION', 'DEPARTMENT', 'UNIVERSITY', 'ENGINEERING', 'TECHNOLOGY', 'PHOTO', 'PAGE', 'OF', 'ID']);
    const SUBJECT_CODE_PATTERN = /^[A-Z]{2,}\d{3,4}$/i;
    const DATE_PATTERN = /^\d{1,2}[-\/](Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[-\/]\d{2,4}$/i;

    const MONTH_MAP = {
        'jan':0, 'feb':1, 'mar':2, 'apr':3, 'may':4, 'jun':5,
        'jul':6, 'aug':7, 'sep':8, 'oct':9, 'nov':10, 'dec':11
    };

    // ---------- ROBUST date parser: returns a timestamp number for sorting ----------
    function parseExamDate(dateStr) {
        // Dates with no value go to the very END
        if (!dateStr || dateStr === 'Date N/A') return Number.MAX_SAFE_INTEGER;

        try {
            // Normalize: replace "/" with "-", trim spaces
            const normalized = dateStr.replace(/\//g, '-').trim();
            const parts = normalized.split('-');
            if (parts.length !== 3) return Number.MAX_SAFE_INTEGER;

            const day   = parseInt(parts[0], 10);
            const month = MONTH_MAP[parts[1].toLowerCase()];   // case-insensitive month
            const yr    = parts[2];
            const year  = yr.length === 2 ? 2000 + parseInt(yr, 10) : parseInt(yr, 10);

            if (isNaN(day) || month === undefined || isNaN(year)) return Number.MAX_SAFE_INTEGER;

            // Return a plain numeric timestamp — no timezone weirdness
            return new Date(year, month, day).getTime();
        } catch (e) {
            return Number.MAX_SAFE_INTEGER;
        }
    }

    fileInput.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        status.innerText = "Initializing scanner...";
        progressContainer.style.display = "block";
        
        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer, cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/cmaps/', cMapPacked: true }).promise;
            
            let allStudents = [];
            let lastStudentName = "Unknown";
            
            for (let i = 1; i <= pdf.numPages; i++) {
                const percent = Math.round((i / pdf.numPages) * 100);
                progressBar.style.width = percent + "%";
                status.innerText = `Scanning Page ${i} of ${pdf.numPages}...`;
                await new Promise(r => setTimeout(r, 0)); 

                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                
                const items = textContent.items
                    .map(item => item.str.trim())
                    .filter(str => str.length > 0); 
                
                for (let j = 0; j < items.length; j++) {
                    const item = items[j];
                    
                    if (/^\d{2}[A-Z][-\s]?\d{4}$/i.test(item)) { 
                        const rollNo = item;
                        let studentName = "Unknown";
                        
                        for (let k = 1; k <= 3; k++) {
                            if (j - k >= 0) {
                                const prevItem = items[j - k];
                                if (prevItem.length > 4 && /[A-Z]/.test(prevItem) && prevItem.includes(' ') && !NAME_SKIP_WORDS.has(prevItem.toUpperCase().split(' ')[0])) {
                                    studentName = prevItem;
                                    lastStudentName = studentName;
                                    break;
                                }
                            }
                        }
                        
                        const studentSubjects = [];
                        
                        for (let l = j + 1; l < j + 50 && l < items.length; l++) {
                            const currentItem = items[l];
                            
                            if (currentItem.includes(',') && SUBJECT_CODE_PATTERN.test(currentItem.split(',')[0])) {
                                const parts = currentItem.split(',');
                                const rowStartIndex = l;
                                
                                const subjectCode    = parts[0].trim();
                                const subjectSection = parts[1].trim();
                                const subjectCourseName = items[rowStartIndex + 1] || 'Course N/A';
                                
                                // DATE EXTRACTION
                                let subjectDate = 'Date N/A';
                                for (let d = rowStartIndex + 2; d < rowStartIndex + 6 && d < items.length; d++) {
                                    if (DATE_PATTERN.test(items[d])) {
                                        subjectDate = items[d];
                                        break;
                                    }
                                }
                                
                                // DAY CALCULATION
                                let subjectDay = 'Day N/A';
                                if (subjectDate !== 'Date N/A') {
                                    try {
                                        const ts = parseExamDate(subjectDate);
                                        if (ts !== Number.MAX_SAFE_INTEGER) {
                                            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                                            subjectDay = days[new Date(ts).getDay()];
                                        }
                                    } catch (e) {
                                        subjectDay = 'Day N/A';
                                    }
                                }
                                
                                const subjectTime    = items[rowStartIndex + 3] || 'Time N/A';
                                const subjectTeacher = items[rowStartIndex + 4] || 'Teacher N/A';
                                const seatItem       = items[rowStartIndex + 5];
                                const subjectRoom    = (seatItem && seatItem.trim().length > 0) ? seatItem.trim() : 'Room N/A';
                                
                                studentSubjects.push({
                                    code: subjectCode,
                                    section: subjectSection,
                                    courseName: subjectCourseName,
                                    date: subjectDate,
                                    day: subjectDay,
                                    time: subjectTime,
                                    teacher: subjectTeacher,
                                    room: subjectRoom
                                });
                            }
                            
                            if (/^\d{2}[A-Z][-\s]?\d{4}$/i.test(currentItem)) {
                                break;
                            }
                        }

                        const finalName = (studentName === "Unknown" || studentName.toUpperCase().includes(rollNo.split('-')[0])) ? lastStudentName : studentName;
                        
                        studentSubjects.forEach(sub => {
                            allStudents.push({
                                roll: rollNo,
                                name: finalName,
                                room: sub.room,
                                section: sub.section,
                                subject: sub.code,
                                courseName: sub.courseName,
                                date: sub.date,
                                day: sub.day,
                                teacher: sub.teacher,
                                time: sub.time,
                                // hidden numeric key used for sorting — won't appear in JSON output
                                _sortKey: parseExamDate(sub.date)
                            });
                        });
                    }
                }
            }

            // ---- SORT: earliest date first, N/A dates last ----
            status.innerText = `Sorting ${allStudents.length} entries by exam date...`;
            await new Promise(r => setTimeout(r, 10));

            allStudents.sort((a, b) => a._sortKey - b._sortKey);

            // Remove the hidden sort key before saving
            const cleanStudents = allStudents.map(({ _sortKey, ...rest }) => rest);

            status.innerText = `✅ Done! Sorted ${cleanStudents.length} exam slots. Downloading...`;
            downloadJSON(cleanStudents);

        } catch (err) {
            console.error("PDF Parsing Error:", err);
            status.innerText = "❌ Error parsing PDF. Check console for details.";
        }
    });

    function downloadJSON(data) {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "data.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        document.body.removeChild(downloadAnchor);
    }
</script>
</body>
</html>
